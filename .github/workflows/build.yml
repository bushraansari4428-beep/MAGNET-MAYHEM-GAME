name: Build Magnet Mayhem (Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build Unity Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          buildName: MagnetMayhem
          buildsPath: build
          buildMethod: MagnetMayhem.EditorTools.MagnetMayhemEditorBuilder.BuildAndroid
          androidTargetSdkVersion: '34'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetMayhem-Android-APK
          path: build/Android/MagnetMayhem.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.2
          name: "Magnet Mayhem v1.0.2 (Gameplay & Level Start Fixed)"
          body: "Official 64-bit ARM64 Android APK. Fixes instant Game Over bug on level start, adds input cooldown debounce, spawn grace period, and smooth level intro countdown."
          files: build/Android/MagnetMayhem.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
